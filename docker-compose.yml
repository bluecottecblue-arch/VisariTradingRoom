version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: strategyforge
      POSTGRES_USER: sf_user
      POSTGRES_PASSWORD: sf_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sf_user:sf_pass@postgres:5432/strategyforge
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POLYGON_API_KEY: ${POLYGON_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://sf_user:sf_pass@postgres:5432/strategyforge
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POLYGON_API_KEY: ${POLYGON_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    command: celery -A tasks.worker worker --loglevel=info --concurrency=2

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  storage_data:
