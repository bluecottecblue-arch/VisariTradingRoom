services:
  - type: web
    name: visari-trading-room-api
    env: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: STORAGE_PATH
        value: ./storage
      - key: CORS_ALLOW_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: https://.*\.vercel\.app
